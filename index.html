<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>Custom New Tab Page</title>
  </head>
  <body>
    <div id="app">
      <div class="content">
        <div class="clock-container">
          <div id="clock">--:--:-- AM</div>
          <div id="date">--/--/----</div>
        </div>
        <div class="bookmarks-container">
          <a href="https://github.com">
            <img src="https://skillicons.dev/icons?i=github" alt="GitHub">
          </a>
          <a href="https://discord.com">
            <img src="https://skillicons.dev/icons?i=discord" alt="Discord">
          </a>
          <a href="https://gmail.com">
            <img src="https://skillicons.dev/icons?i=gmail" alt="GMail">
          </a>
          <a href="https://spotify.com">
            <img src="https://skillicons.dev/icons?i=spotify" alt="Spotify">
          </a>
        </div>
        <input type="text" spellcheck="false" placeholder="Search Google..." id="query" class="search-input" autocomplete="off">
        <p>Photo by <a href="https://unsplash.com/@baraajalahej?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Baraa Jalahej</a> on <a href="https://unsplash.com/photos/purple-flower-buds-in-tilt-shift-lens-f4onPVxy06o?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
